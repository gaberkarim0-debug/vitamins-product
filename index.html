<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products</title>
    <!-- font Roboto-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- bootstrap v 5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"

  <body class="overflow-x-hidden">
    <nav
      class="d-flex py-4 px-4 justify-content-around align-items-center shadow text-white"

      <div class="logo">
        <a class="text-decoration-none text-white" href="./index.html"
          ><h1 class="fw-bold">iHerp</h1></a
        >
      </div>
      <div class="d-flex align-items-center gap-4 links">
        <a class="text-decoration-none product text-white d-flex align-items-center gap-1" href="./index.html"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            width="17px"
            height="17px"
            viewBox="0 0 20 20"
          >
            <path d="M0 0h20v20H0z" fill="none" />
            <path
              fill="currentColor"
              d="M17 8h1v11H2V8h1V6c0-2.76 2.24-5 5-5c.71 0 1.39.15 2 .42A4.9 4.9 0 0 1 12 1c2.76 0 5 2.24 5 5zM5 6v2h2V6c0-1.13.39-2.16 1.02-3H8C6.35 3 5 4.35 5 6m10 2V6c0-1.65-1.35-3-3-3h-.02A4.98 4.98 0 0 1 13 6v2zm-5-4.22C9.39 4.33 9 5.12 9 6v2h2V6c0-.88-.39-1.67-1-2.22"

            width="25px"
            height="25px"
            viewBox="0 0 24 24"
          >
            <path d="M0 0h24v24H0z" fill="none" />

              fill="white"
              d="M8 18a2 2 0 1 0 0 4a2 2 0 1 0 0-4m9 0a2 2 0 1 0 0 4a2 2 0 1 0 0-4M6 15c0 .55.45 1 1 1h12c.46 0 .86-.31.97-.76l2-8c.07-.3 0-.62-.18-.86S21.31 6 21 6H8V3c0-.55-.45-1-1-1H2v2h4zm2-7h11.72l-1.5 6H8z"
            />
          </svg>
        </a>
      </div>
    </nav>
    <!-- nav & taps -->
     <section class="nav-tap d-flex list-unstyled">
      <li onclick="displayProducts()">All</li>
      <li onclick="displayVitamin()">Vitamines</li>
      <li onclick="showSupplements()">Supplements</li>
      <li onclick="showGroceryItem()">Grocery</li>
     </section>
    <!-- main -->
    <main class="mt-5">
      <div class="row g-5"></div>
    </main>
    <script src="./js/index.js"></script>
